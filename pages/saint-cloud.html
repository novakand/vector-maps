        .service-areas__title {

            font-size: 32px;
            font-weight: 700;
            color: #ffab1e;
            margin-bottom: 48px;
        }

        /* GRID как в jvm-docs */
        .service-areas__grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 32px;
        }

        /* список */
        .service-areas__grid ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .service-areas__grid li {
            margin-bottom: 10px;
        }

        .service-areas__grid a {
            font-size: 16px;
            color: #002149;
            text-decoration: none;
            line-height: 1.4;
        }

        .service-areas__grid a:hover {
            text-decoration: underline;
            color: #0f172a;
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 1024px) {

            shape-rendering: geometricPrecision;
            display: block;
            margin: 0 auto;

                    if ([...document.scripts].some(s => s.src === src)) {
                        resolve();
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = src;
                    script.defer = true;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error(`Failed to load ${src}`));
                    document.head.appendChild(script);
                });

            const loadStyle = (href) =>

                    if ([...document.styleSheets].some(s => s.href === href)) {

                        return;
                    }

                    link.rel = 'stylesheet';
                    link.href = href;
                    link.onload = resolve;
                    document.head.appendChild(link);
                });

        function geoJsonToMarkers(geoJson) {
            if (!geoJson || geoJson.type !== "FeatureCollection" || !Array.isArray(geoJson.features)) {
                console.warn("Invalid GeoJSON", geoJson);
                return [];
            }

            return geoJson.features
                .filter((feature) => feature && feature.geometry && feature.geometry.type === "Point" && Array.isArray(feature.geometry.coordinates))
                .map((feature) => {
                    const [lng, lat] = feature.geometry.coordinates;
                    const props = feature.properties || {};

                    return {
                        coords: [lat, lng],
                        name: props.name || "",
                        data: props,
                    };
                });
        }


        function addGeoJsonFeatures(geoJson) {
            markersData = geoJsonToMarkers(geoJson);
        }

        function onInitMap() {
            const MAPS_COLORS = {
                land: '#dee2e9',
                landHover: '#dee2e9',
                landSelected: '#FFB020',
                border: '#CBD5E1',
                water: "#fffff",
            };

            const container = document.getElementById("maps");
            if (!container) return;

            addGeoJsonFeatures(datGeoJson);

            map = new jsVectorMap({
                selector: "#maps",
                map: "saint-cloud",
                regionsSelectable: false,
                backgroundColor: MAPS_COLORS.water,
                zoomButtons: false,
                zoomOnScroll: true,
                zoomMin: 1,
                zoomMax: 10,
                zoomAnimate: false,
                zoomStep: 1,
                showTooltip: false,
                tooltipStyle: {
                    backgroundColor: '#000',
                    color: '#fff'
                },
                markers: markersData,
                markerStyle: {
                    initial: {
                        fill: '#FFAB1E',
                        stroke: '#FFFFFF',
                        'stroke-width': 4,
                        r: 6
                    },
                    hover: {
                        fill: '#F59E0B'
                    },
                    selected: {
                        fill: '#EA580C'
                    }
                },
                onRegionTooltipShow(event, tooltip, code) {
                    if (!REGIONS[code]?.label) {
                        event.preventDefault();
                        return;
                    }

                    tooltip.text(REGIONS[code].label);
                },

                onRegionLabelShow: function (e, el, code) {
                    e.preventDefault();
                },
                regionStyle: {
                    initial: { fill: '#dee2e9' },
                    hover: { fill: '#dee2e9', fillOpacity: 1 },
                    selectedHover: { fill: '#dee2e9' }
                },
                focusOn: {
                    scale: 1.15,
                    animate: true,
                },

                labels: {
                    regions: {

                        render(code) {
                            return null;
                        }

                    },
                    markers: {
                        render(marker) {
                            return marker.name || "";
                        },

                    },
                },

                onLoaded(mapInstance) {
                    map = mapInstance;
                    requestAnimationFrame(() => {
                        resolveMarkerLabelCollisions(map);
                    });

                    window.addEventListener("resize", () => {
                        mapInstance.updateSize();
                        requestAnimationFrame(() => {
                            resolveMarkerLabelCollisions(map);
                        });
                    });

                },

                onMarkerClick(event, index) {
                    const code = markersData[index]?.data?.code;
                    navigateToRegion(code);
                },

                onRegionClick(event, code) {
                    const region = REGIONS[code];
                    if (!region) {
                        event.preventDefault();
                        return;
                    }

                    navigateToRegion(code);
                },

                onViewportChange(scale, transX, transY) {

                    requestAnimationFrame(() => {
                        resolveMarkerLabelCollisions(map);
                    });

                }
            });

            map.extend('enableRegionHover', function ({ allow = null, onEnter, onLeave } = {}) {
                const map = this;
                const allowed = allow ? new Set(allow) : null;

                Object.entries(map.regions).forEach(([code, region]) => {
                    const node = region?.element?.shape?.node;
                    if (!node) return;

                    if (allowed && !allowed.has(code)) return;

                    node.addEventListener('mouseenter', () => {
                        onEnter?.(code, region, map);
                    });

                    node.addEventListener('mouseleave', () => {
                        onLeave?.(code, region, map);
                    });
                });
            });

        }

        function setActiveRegion(code) {
            if (activeRegionCode === code) return;

            if (activeRegionCode && map?.regions?.[activeRegionCode]) {
                map.regions[activeRegionCode]
                    .element.shape.node
                    .classList.remove('is-active');
            }

            activeRegionCode = code;

            if (code && map?.regions?.[code]) {
                map.regions[code]
                    .element.shape.node
                    .classList.add('is-active');
            }
        }

        function resolveMarkerLabelCollisions(map) {
            const labelsGroup = map?._markerLabelsGroup?.node;
            const markersGroup = map?._markersGroup?.node;
            if (!labelsGroup || !markersGroup) return;

            const labels = Array.from(
                labelsGroup.querySelectorAll('text.jvm-element.jvm-label')
            );
            if (!labels.length) return;

            labels.sort((a, b) => {
                const la = a.textContent.length;
                const lb = b.textContent.length;
                if (la !== lb) return la - lb;
                return a.getBBox().y - b.getBBox().y;
            });

            const markersByIndex = new Map(
                Array.from(
                    markersGroup.querySelectorAll('circle.jvm-element.jvm-marker')
                ).map(m => [m.dataset.index, m])
            );

            labels.forEach(l => l.classList.remove('jvm-hidden'));
            markersByIndex.forEach(m => m.classList.remove('jvm-hidden'));

            const placedBBoxes = [];

            labels.forEach(label => {
                const marker = markersByIndex.get(label.dataset.index);
                if (!marker) return;

                const bbox = label.getBBox();

                const collided =
                    labelHitsMarker(label, marker) ||
                    placedBBoxes.some(b => bboxesIntersect(bbox, b));

                if (collided) {
                    label.classList.add('jvm-hidden');
                    marker.classList.add('jvm-hidden');
                } else {
                    placedBBoxes.push(bbox);
                }
            });
        }


        function labelHitsMarker(label, marker, minGap = 1.5) {
            const cx = parseFloat(marker.getAttribute('cx'));
            const r = parseFloat(marker.getAttribute('r')) || 6;

            const bbox = label.getBBox();

            let distX;

            if (bbox.x > cx) {
                distX = bbox.x - cx;
            } else if (bbox.x + bbox.width < cx) {
                distX = cx - (bbox.x + bbox.width);
            } else {
                distX = 0;
            }

            return distX < (r + minGap);
        }

        function pointInsideBBox(p, b) {
            return (
                p.x >= b.x &&
                p.x <= b.x + b.width &&
                p.y >= b.y &&
                p.y <= b.y + b.height
            );
        }

        function bboxesIntersect(a, b) {
            return !(
                a.x + a.width < b.x ||
                a.x > b.x + b.width ||
                a.y + a.height < b.y ||
                a.y > b.y + b.height
            );
        }

        function navigateToRegion(code) {
            const region = REGIONS[code];
            if (!region?.url) return;

            window.location.href = region.url;
        }

        function renderServiceAreas() {
            const container = document.getElementById('service-areas-list');
            if (!container) return;

            const regions = Object.values(REGIONS);

            const columns = 4;
            const perColumn = Math.ceil(regions.length / columns);

            for (let i = 0; i < columns; i++) {
                const ul = document.createElement('ul');

                regions
                    .slice(i * perColumn, (i + 1) * perColumn)
                    .forEach(region => {
                        const li = document.createElement('li');
                        const link = document.createElement('a');

                        link.href = region.url;
                        link.textContent = region.label;

                        li.appendChild(link);
                        ul.appendChild(li);
                    });

                container.appendChild(ul);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            if (!window.vectorMaps?.init) {
                console.error('vectorMaps loader not found');
                return;
            }

            await vectorMaps.init();
        });
    </script>
</body>

</html>

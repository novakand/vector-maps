        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            background: #ffff;
            color: #fff;
        }


        /* ---------- MAP DESCRIPTION ---------- */

        .map-description {
            max-width: 900px;
            margin: 32px auto 0;
            padding: 0 16px;
            text-align: center;
            font-size: 20px;
            line-height: 1.6;
            color: #64748b;
        }

        /* ---------- SERVICE AREAS HEADER ---------- */

        .service-areas__header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 48px;
        }

        .service-areas__header span {
            flex: 0 0 160px;
            /* длина линии */
            height: 1px;
            background: #e2e8f0;
        }

        .service-areas__header h2 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            color: #002149;
            white-space: nowrap;
        }


        .map-divider {
            max-width: 820px;
            height: 1px;
            margin: 48px auto 64px;
            background: #e2e8f0;
        }

        .map-section {
            padding: 48px 0;
            background: #fff;
        }

        #maps {
            max-width: 1200px;
            height: 520px;
            /* ключевой момент */
            margin: 0 auto;
        }

        .service-areas {
            padding: 64px 16px 80px;
            background: #ffffff;
        }

        .service-areas__inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-areas__title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #ffab1e;
            margin-bottom: 48px;
        }

        /* GRID как в jvm-docs */
        .service-areas__grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 32px;
        }

        /* список */
        .service-areas__grid ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .service-areas__grid li {
            margin-bottom: 10px;
        }

        .service-areas__grid a {
            font-size: 16px;
            color: #002149;
            text-decoration: none;
            line-height: 1.4;
        }

        .service-areas__grid a:hover {
            text-decoration: underline;
            color: #0f172a;
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 1024px) {
            .service-areas__grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            #maps {
                height: 380px;
            }

            .service-areas__grid {
                grid-template-columns: 1fr;
            }
        }

        .map-section {
            padding: 8px 0;
            background: #fff;
        }

        #maps {
            max-width: 1200px;
            height: 720px;

            margin-bottom: 10px;
        }

        .service-areas__grid a {
            font-size: 16px;
            color: #002149;
            text-decoration: none;
        }

        .service-areas__grid a:hover {
            text-decoration: underline;
            color: #002149;
        }

        /* Адаптив */
        @media (max-width: 1024px) {
            .service-areas__grid {
                grid-template-columns: repeat(2, 1fr);

        @media (max-width: 600px) {

                height: 380px;

                grid-template-columns: 1fr;
            }
        }

        .jvm-region.jvm-element:hover {}

        #maps .jvm-marker {
            cursor: pointer;
        }

        #maps svg {
            shape-rendering: geometricPrecision;
        }


        #maps svg text {
            fill: #002149;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.01em;
            paint-order: stroke;
            stroke: #002149;
            stroke-width: 1.3px;
            stroke-linejoin: round;
            user-select: none;
        }

        .jvm-region {}

        .jvm-region.is-active {

            cursor: pointer;
            fill-opacity: 0.77;
        }

        .jvm-label,

        }

        .jvm-hidden {

        }

            color: #002149;

        function geoJsonToMarkers(geoJson) {
            if (!geoJson || geoJson.type !== "FeatureCollection" || !Array.isArray(geoJson.features)) {
                console.warn("Invalid GeoJSON", geoJson);
                return [];
            }

            return geoJson.features
                .filter((feature) => feature && feature.geometry && feature.geometry.type === "Point" && Array.isArray(feature.geometry.coordinates))
                .map((feature) => {
                    const [lng, lat] = feature.geometry.coordinates;
                    const props = feature.properties || {};

                    return {
                        coords: [lat, lng],
                        name: props.name || props.city || "",
                        data: props,
                    };
                });
        }

        const getGeoJsonBounds = (geoJson) => {
            const coords = geoJson?.features
                ?.map((f) => f?.geometry?.coordinates)
                ?.filter((c) => Array.isArray(c) && c.length === 2)
                ?.filter(([lng, lat]) => Number.isFinite(lng) && Number.isFinite(lat));

            if (!coords?.length) return null;

            const [minLng, maxLng, minLat, maxLat] = coords.reduce(
                ([minLng, maxLng, minLat, maxLat], [lng, lat]) => [
                    minLng === null || lng < minLng ? lng : minLng,
                    maxLng === null || lng > maxLng ? lng : maxLng,
                    minLat === null || lat < minLat ? lat : minLat,
                    maxLat === null || lat > maxLat ? lat : maxLat,
                ],
                [null, null, null, null]
            );

            return [
                [minLng, minLat],
                [maxLng, maxLat],
            ];
        };

        function getGeoJsonCenter(geoJson) {
            const bounds = getGeoJsonBounds(geoJson);
            if (!bounds) return [55, 37];

            const [[minLng, minLat], [maxLng, maxLat]] = bounds;
            const centerLat = (minLat + maxLat) / 2;
            const centerLng = (minLng + maxLng) / 2;

            return [centerLat, centerLng];
        }

        function getGeoJsonScale(geoJson) {
            const bounds = getGeoJsonBounds(geoJson);
            if (!bounds) return 3;

            const [[, minLat], [, maxLat]] = bounds;
            const span = Math.abs(maxLat - minLat);

            if (span > 60) return 1.2;
            if (span > 30) return 1.6;
            if (span > 15) return 2.2;
            if (span > 8) return 3;
            return 4;
        }


        function addGeoJsonFeatures(geoJson) {
            markersData = geoJsonToMarkers(geoJson);
        }

        function updateRegionLabelsVisibility(scale) {
            const container = document.getElementById('maps');
            if (!container) return;

            const HIDE_LABELS_THRESHOLD = 1.8;

            if (scale < HIDE_LABELS_THRESHOLD) {
                container.classList.add('hide-region-labels');
            } else {
                container.classList.remove('hide-region-labels');
            }

        function onInitMap() {

            const scale = getGeoJsonScale(datGeoJson);

                landSelected: '#FFB020',
                border: '#CBD5E1',
                water: "#fffff",
            };

            map = new jsVectorMap({
                selector: "#maps",
                map: "orlando-metro",
                regionsSelectable: false,
                backgroundColor: MAPS_COLORS.water,
                zoomButtons: false,
                zoomOnScroll: false,
                zoomMin: 1,
                zoomMax: 10,
                zoomAnimate: false,
                zoomStep: 1,
                showTooltip: false,
                tooltipStyle: {
                    backgroundColor: '#000',
                    color: '#fff'
                },
                markers: markersData,
                markerStyle: {
                    initial: {
                        fill: '#FFAB1E',
                        stroke: '#FFFFFF',
                        'stroke-width': 4,
                        r: 6
                    },
                    hover: {
                        fill: '#F59E0B'
                    },
                    selected: {
                        fill: '#EA580C'
                    }
                },
                onRegionTooltipShow(event, tooltip, code) {
                    if (!REGIONS[code]?.label) {
                        event.preventDefault();
                        return;
                    }

                    tooltip.text(REGIONS[code].label);
                },

                onRegionLabelShow: function (e, el, code) {
                    e.preventDefault();
                },
                regionStyle: {
                    initial: { fill: '#dee2e9' },
                    hover: { fill: '#dee2e9', fillOpacity: 1 },
                    selectedHover: { fill: '#dee2e9' }
                },

                labels: {
                    regions: {

                        render(code) {
                            return null;
                        }

                    },
                    markers: {
                        render(marker) {
                            return marker.name || "";
                        },

                    },
                },

                onLoaded(mapInstance) {
                    console.log(mapInstance, 'MAP LOADED');
                    map = mapInstance;

                    requestAnimationFrame(() => {
                        resolveMarkerLabelCollisions(map);
                    });

                    window.addEventListener("resize", () => {
                        mapInstance.updateSize();
                        requestAnimationFrame(() => {
                            resolveMarkerLabelCollisions(map);
                        });
                    });

                },

                onMarkerClick(event, index) {
                },

                onRegionClick(event, code) {
                    const region = REGIONS[code];
                    if (!region) {
                        event.preventDefault();
                        return;
                    }

                    navigateToRegion(code);
                },

                onViewportChange(scale, transX, transY) {

                    requestAnimationFrame(() => {
                        resolveMarkerLabelCollisions(map);
                    });

                }
            });

            map.extend('$enableRegionHover', function ({ allow = null, onEnter, onLeave } = {}) {
                const map = this;
                const allowed = allow ? new Set(allow) : null;

                Object.entries(map.regions).forEach(([code, region]) => {
                    const node = region?.element?.shape?.node;
                    if (!node) return;

                    if (allowed && !allowed.has(code)) return;

                    node.addEventListener('mouseenter', () => {
                        onEnter?.(code, region, map);
                    });

                    node.addEventListener('mouseleave', () => {
                        onLeave?.(code, region, map);
                    });
                });
            });

            map.$enableRegionHover({
                allow: Object.keys(REGIONS),

                onEnter(code, region) {
                    region.element.shape.node.classList.add('is-active');
                },

                onLeave(code, region) {
                    region.element.shape.node.classList.remove('is-active');
                }
            });
        }


        function setActiveRegion(code) {
            if (activeRegionCode === code) return;

            if (activeRegionCode && map?.regions?.[activeRegionCode]) {
                map.regions[activeRegionCode]
                    .element.shape.node
                    .classList.remove('is-active');
            }

            activeRegionCode = code;

            if (code && map?.regions?.[code]) {
                map.regions[code]
                    .element.shape.node
                    .classList.add('is-active');
            }
        }

        function resolveMarkerLabelCollisions(map) {
            const labelsGroup = map?._markerLabelsGroup?.node;
            const markersGroup = map?._markersGroup?.node;
            if (!labelsGroup || !markersGroup) return;

            const labels = Array.from(
                labelsGroup.querySelectorAll('text.jvm-element.jvm-label')
            );
            if (!labels.length) return;

            labels.sort((a, b) => {
                const la = a.textContent.length;
                const lb = b.textContent.length;
                if (la !== lb) return la - lb;
                return a.getBBox().y - b.getBBox().y;
            });

            const markersByIndex = new Map(
                Array.from(
                    markersGroup.querySelectorAll('circle.jvm-element.jvm-marker')
                ).map(m => [m.dataset.index, m])
            );

            // reset
            labels.forEach(l => l.classList.remove('jvm-hidden'));
            markersByIndex.forEach(m => m.classList.remove('jvm-hidden'));

            const placedBBoxes = [];

            labels.forEach(label => {
                const marker = markersByIndex.get(label.dataset.index);
                if (!marker) return;

                const bbox = label.getBBox();

                const collided =
                    labelHitsMarker(label, marker) ||
                    placedBBoxes.some(b => bboxesIntersect(bbox, b));

                if (collided) {
                    label.classList.add('jvm-hidden');
                    marker.classList.add('jvm-hidden');
                } else {
                    placedBBoxes.push(bbox);
                }
            });
        }


        function labelHitsMarker(label, marker, minGap = 1.5) {
            const cx = parseFloat(marker.getAttribute('cx'));
            const r = parseFloat(marker.getAttribute('r')) || 6;

            const bbox = label.getBBox();

            let distX;

            if (bbox.x > cx) {
                distX = bbox.x - cx;
            } else if (bbox.x + bbox.width < cx) {
                distX = cx - (bbox.x + bbox.width);
            } else {
                distX = 0;
            }

            return distX < (r + minGap);
        }

        function pointInsideBBox(p, b) {
            return (
                p.x >= b.x &&
                p.x <= b.x + b.width &&
                p.y >= b.y &&
                p.y <= b.y + b.height
            );
        }

        function bboxesIntersect(a, b) {
            return !(
                a.x + a.width < b.x ||
                a.x > b.x + b.width ||
                a.y + a.height < b.y ||
                a.y > b.y + b.height
            );
        }

        function highlightRegion(code) {
            if (!code || !map?.regions?.[code]) return;
            map.regions[code].element.shape.node.classList.add('is-active');
        }

        function clearRegionHighlight(code) {
            if (!code || !map?.regions?.[code]) return;
            map.regions[code].element.shape.node.classList.remove('is-active');
        }


        function navigateToRegion(code) {
            const region = REGIONS[code];
            if (!region?.url) return;

            window.location.href = region.url;
        }


        function renderServiceAreas() {
            const container = document.getElementById('service-areas-list');
            if (!container) return;

            const regions = Object.values(REGIONS);

            const columns = 4;
            const perColumn = Math.ceil(regions.length / columns);

            for (let i = 0; i < columns; i++) {
                const ul = document.createElement('ul');

                regions
                    .slice(i * perColumn, (i + 1) * perColumn)
                    .forEach(region => {
                        const li = document.createElement('li');
                        const link = document.createElement('a');

                        link.href = region.url;
                        link.textContent = region.label;

                        li.appendChild(link);
                        ul.appendChild(li);
                    });

                container.appendChild(ul);
            }
        }



        document.addEventListener("DOMContentLoaded", () => {
            onInitMap();
            renderServiceAreas();
        });
    </script>
</body>

</html>

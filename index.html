<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Vector Maps / jsVectorMap</title>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    />

    <style>
        :root {
            /* colors */
            --color-bg-white: #fff;
            --color-text-main: #002149;
            --color-text-muted: #64748b;
            --color-accent: #ffab1e;
            --color-accent-dark: #0f172a;
            --color-divider: #e2e8f0;

            /* layout */
            --container-width: 1200px;
            --map-radius: 12px;

            /* typography */
            --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: var(--font-main);
            background: var(--color-bg-white);
            color: #fff;
        }

        /* ---------- MAP ---------- */

        .map-section {
            padding: 8px 0;
            background: var(--color-bg-white);
        }

        #maps {
            max-width: initial;
            height: 680px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: var(--map-radius);
        }

        #maps .jvm-marker {
            cursor: pointer;
        }

        #maps svg {
            display: block;
            margin: 0 auto;
            shape-rendering: geometricPrecision;
        }

        #maps svg text {
            fill: var(--color-text-main);
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.01em;
            paint-order: stroke;
            stroke: var(--color-text-main);
            stroke-width: 1.3px;
            stroke-linejoin: round;
            user-select: none;
        }

        .map-divider {
            max-width: 820px;
            height: 1px;
            margin: 48px auto 64px;
            background: var(--color-divider);
        }

        .map-description {
            max-width: 900px;
            margin: 32px auto 0;
            padding: 0 16px;
            text-align: center;
            font-size: 20px;
            line-height: 1.6;
            color: var(--color-text-muted);
        }

        /* ---------- SERVICE AREAS ---------- */

        .service-areas {
            padding: 64px 16px 80px;
            background: var(--color-bg-white);
        }

        .service-areas__inner {
            max-width: var(--container-width);
            margin: 0 auto;
        }

        .service-areas__header {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 40px;
        }

        .service-areas__header span {
            flex: 1;
            height: 1px;
            background: var(--color-divider);
        }

        .service-areas__header h2 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            color: var(--color-text-main);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .service-areas__grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 32px;
        }

        .service-areas__grid ul {
            list-style: disc;
            margin: 0;
            padding-left: 18px;
        }

        .service-areas__grid li {
            margin-bottom: 10px;
        }

        .service-areas__grid li::marker {
            color: var(--color-text-main);
        }

        .service-areas__grid a {
            display: inline-block;
            padding: 6px 0;
            font-size: 18px;
            color: var(--color-text-main);
            text-decoration: none;
            line-height: 1.4;
        }

        .service-areas__grid a:hover {
            text-decoration: underline;
            color: var(--color-accent-dark);
        }

        /* ---------- jsVectorMap ---------- */

        .jvm-region.is-active {
            fill: var(--color-accent) !important;
            fill-opacity: 0.77;
            cursor: pointer;
        }

        .jvm-label,
        .jvm-marker {
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .jvm-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .jvm-tooltip {
            background-color: var(--color-accent) !important;
            color: var(--color-accent-dark) !important;
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 1024px) {
            .service-areas__grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            #maps {
                height: 380px;
            }

            .map-description {
                font-size: 18px;
            }

            .service-areas__header h2 {
                font-size: 22px;
            }

            .service-areas__grid a {
                font-size: 16px;
            }

            .service-areas__grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

                        return;
                    }

                    const script = document.createElement('script');
                    script.src = src;
                    script.defer = true;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error(`Failed to load ${src}`));
                    document.head.appendChild(script);
                });

            const loadStyle = (href) =>
                new Promise((resolve) => {
                    if ([...document.styleSheets].some(s => s.href === href)) {
                        resolve();
                        return;
                    }

                    link.rel = 'stylesheet';
                    link.href = href;
                    link.onload = resolve;
                    document.head.appendChild(link);
                });

        function onInitMap() {

            const container = document.getElementById("maps");
            if (!container) return;

            addGeoJson(datGeoJson);

            map = new jsVectorMap({
                selector: "#maps",
                map: "orlando-metro",
                regionsSelectable: false,
                backgroundColor: MAPS_COLORS.water,
                zoomButtons: false,
                zoomOnScroll: true,
                zoomMin: 1,
                zoomMax: 10,
                zoomAnimate: false,
                zoomStep: 1,
                showTooltip: false,
                tooltipStyle: {
                    backgroundColor: '#000',
                    color: '#fff'
                },
                markers: markersData,
                markerStyle: {
                    initial: {
                        fill: '#FFAB1E',
                        stroke: '#FFFFFF',
                        'stroke-width': 4,
                        r: 6
                    },
                    hover: {
                        fill: '#F59E0B'
                    },
                    selected: {
                        fill: '#EA580C'
                    }
                },
                onRegionTooltipShow(event, tooltip, code) {
                    if (!REGIONS[code]?.label) {
                        event.preventDefault();
                        return;
                    }

                    tooltip.text(REGIONS[code].label);
                },

                onRegionLabelShow: function (e, el, code) {
                    e.preventDefault();
                },
                regionStyle: {
                    initial: {
                        fill: '#dee2e9', stroke: '#cbd5e1',
                        strokeWidth: 2,
                        strokeOpacity: 1
                    },
                    hover: { fill: '#dee2e9', fillOpacity: 1 },
                    selectedHover: { fill: '#dee2e9' }
                },
                focusOn: {
                    scale: 1.15,
                    animate: true,
                },

                labels: {
                    regions: {

                        render(code) {
                            return null;
                        }

                    },
                    markers: {
                        render(marker) {
                            return marker.name || "";
                        },

                    },
                },

                onLoaded(mapInstance) {
                    console.log("Map loaded", mapInstance);
                    map = mapInstance;
                    requestAnimationFrame(() => {
                        resolveMarkerLabelCollisions(map);
                    });

                    window.addEventListener("resize", () => {
                        mapInstance.updateSize();
                        requestAnimationFrame(() => {
                            resolveMarkerLabelCollisions(map);
                        });
                    });

                },

                onMarkerClick(event, index) {
                    const code = markersData[index]?.data?.code;
                    navigateToRegion(code);
                },

                onRegionClick(event, code) {
                    const region = REGIONS[code];
                    if (!region) {
                        event.preventDefault();
                        return;
                    }
                    navigateToRegion(code);
                },

                onViewportChange(scale, transX, transY) {

                    requestAnimationFrame(() => {
                        resolveMarkerLabelCollisions(map);
                    });

                }
            });

            extendRegionsHover(map);
            map.enableRegionHover({
                allow: Object.keys(REGIONS),
                onEnter(code, region) {
                    region.element.shape.node.classList.add('is-active');
                },
                onLeave(code, region) {
                    region.element.shape.node.classList.remove('is-active');
                }
            });
        }


        function buildGeoJson(geoJson) {
            if (!geoJson || geoJson.type !== "FeatureCollection" || !Array.isArray(geoJson.features)) {
                console.warn("Invalid GeoJSON", geoJson);
                return [];
            }

            return geoJson.features
                .filter((feature) => feature && feature.geometry && feature.geometry.type === "Point" && Array.isArray(feature.geometry.coordinates))
                .map((feature) => {
                    const [lng, lat] = feature.geometry.coordinates;
                    const props = feature.properties || {};

                    return {
                        coords: [lat, lng],
                        name: props.name || "",
                        data: props,
                    };
                });
        }


        function addGeoJson(geoJson) {
            markersData = buildGeoJson(geoJson);
        }

        function extendRegionsHover(map) {
            map.extend('enableRegionHover', function ({ allow = null, onEnter, onLeave } = {}) {
                const map = this;
                const allowed = allow ? new Set(allow) : null;

                Object.entries(map.regions).forEach(([code, region]) => {
                    const node = region?.element?.shape?.node;
                    if (!node) return;

                    if (allowed && !allowed.has(code)) return;

                    node.addEventListener('mouseenter', () => {
                        onEnter?.(code, region, map);
                    });

                    node.addEventListener('mouseleave', () => {
                        onLeave?.(code, region, map);
                    });
                });
            });
        }


        function resolveMarkerLabelCollisions(map) {
            const labelsGroup = map?._markerLabelsGroup?.node;
            const markersGroup = map?._markersGroup?.node;
            if (!labelsGroup || !markersGroup) return;

            const labels = Array.from(
                labelsGroup.querySelectorAll('text.jvm-element.jvm-label')
            );
            if (!labels.length) return;

            labels.sort((a, b) => {
                const la = a.textContent.length;
                const lb = b.textContent.length;
                if (la !== lb) return la - lb;
                return a.getBBox().y - b.getBBox().y;
            });

            const markersByIndex = new Map(
                Array.from(
                    markersGroup.querySelectorAll('circle.jvm-element.jvm-marker')
                ).map(m => [m.dataset.index, m])
            );

            labels.forEach(l => l.classList.remove('jvm-hidden'));
            markersByIndex.forEach(m => m.classList.remove('jvm-hidden'));

            const placedBBoxes = [];

            labels.forEach(label => {
                const marker = markersByIndex.get(label.dataset.index);
                if (!marker) return;

                const bbox = label.getBBox();

                const collided =
                    labelHitsMarker(label, marker) ||
                    placedBBoxes.some(b => bboxesIntersect(bbox, b));

                if (collided) {
                    label.classList.add('jvm-hidden');
                    marker.classList.add('jvm-hidden');
                } else {
                    placedBBoxes.push(bbox);
                }
            });
        }


        function labelHitsMarker(label, marker, minGap = 1.5) {
            const cx = parseFloat(marker.getAttribute('cx'));
            const r = parseFloat(marker.getAttribute('r')) || 6;

            const bbox = label.getBBox();

            let distX;

            if (bbox.x > cx) {
                distX = bbox.x - cx;
            } else if (bbox.x + bbox.width < cx) {
                distX = cx - (bbox.x + bbox.width);
            } else {
                distX = 0;
            }

            return distX < (r + minGap);
        }

        function pointInsideBBox(p, b) {
            return (
                p.x >= b.x &&
                p.x <= b.x + b.width &&
                p.y >= b.y &&
                p.y <= b.y + b.height
            );
        }

        function bboxesIntersect(a, b) {
            return !(
                a.x + a.width < b.x ||
                a.x > b.x + b.width ||
                a.y + a.height < b.y ||
                a.y > b.y + b.height
            );
        }

        function navigateToRegion(code) {
            const region = REGIONS[code];
            if (!region?.url) return;

            window.location.href = region.url;
        }

        function renderServiceAreas() {
            const container = document.getElementById('service-areas-list');
            if (!container) return;

            const regions = Object.values(REGIONS);

            const columns = 4;
            const perColumn = Math.ceil(regions.length / columns);

            for (let i = 0; i < columns; i++) {
                const ul = document.createElement('ul');

                regions
                    .slice(i * perColumn, (i + 1) * perColumn)
                    .forEach(region => {
                        const li = document.createElement('li');
                        const link = document.createElement('a');

                        link.href = region.url;
                        link.textContent = region.label;

                        li.appendChild(link);
                        ul.appendChild(li);
                    });

                container.appendChild(ul);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            if (!window.vectorMaps?.init) {
                console.error('vectorMaps loader not found');
                return;
            }

            await vectorMaps.init();
        });
    </script>
</body>
